<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ぷにぷに風パズルゲーム - 総合修正版</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    }

    body {
      background-color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 750px;
      background: linear-gradient(180deg, #87ceeb 0%, #b0e0e6 30%, #556b2f 31%, #8fbc8f 35%, #4682b4 100%);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 25px rgba(0,0,0,0.9);
      overflow: hidden;
    }

    /* 上部ナビゲーション / Ypt表示 */
    .top-nav {
      height: 42px;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 6px;
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
      z-index: 20;
    }

    .ypt-badge {
      background: linear-gradient(135deg, #f39c12, #f1c40f);
      padding: 3px 8px;
      border-radius: 15px;
      color: #000;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .nav-btn {
      background: #34495e;
      color: #fff;
      border: 1px solid #7f8c8d;
      padding: 4px 6px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 10px;
    }

    .nav-btn.attack-mode-btn {
      background: #e74c3c;
      border-color: #c0392b;
    }

    /* ---- ステージ・エネミーエリア ---- */
    #stage-area {
      height: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      position: relative;
      background: rgba(255, 255, 255, 0.15);
    }

    .stage-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      color: #fff;
      font-weight: bold;
      text-shadow: 2px 2px 4px #000;
      font-size: 14px;
    }

    .enemy-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .enemy-name {
      color: #fff;
      font-weight: bold;
      text-shadow: 1px 1px 3px #000;
      font-size: 13px;
      margin-bottom: 2px;
    }

    .enemy-sprite {
      width: 70px;
      height: 70px;
      background: radial-gradient(circle, #ff6b6b 0%, #c0392b 100%);
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 6px 12px rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 36px;
      animation: floatEnemy 2s infinite ease-in-out;
    }

    @keyframes floatEnemy {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* ---- チーム・必殺技ゲージエリア ---- */
    #team-area {
      height: 65px;
      background: rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 10px;
      z-index: 10;
    }

    .char-icon {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 4px solid #888;
      background: radial-gradient(circle, #e0e0e0 0%, #9e9e9e 100%);
      position: relative;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 26px;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.6), 0 4px 6px rgba(0,0,0,0.4);
      transition: transform 0.1s;
    }

    .char-icon:active { transform: scale(0.92); }

    .char-icon.ready {
      animation: pulseGlow 0.8s infinite alternate;
      border-color: #f1c40f;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 5px #f1c40f; transform: scale(1); }
      100% { box-shadow: 0 0 15px #f1c40f; transform: scale(1.08); }
    }

    .gauge-overlay {
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 0%;
      background: rgba(241, 196, 15, 0.7);
      border-radius: 50%;
      pointer-events: none;
      transition: height 0.2s ease-out;
    }

    /* ---- パズルエリア ---- */
    #puzzle-area {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .puni-bowl-frame {
      position: absolute;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      border: 14px solid #38b6ff;
      box-shadow: inset 0 0 15px #000, 0 0 15px rgba(0,0,0,0.5);
      background: radial-gradient(circle, #1a2a40 0%, #0d1520 100%);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      background: transparent;
      touch-action: none;
    }

    .bowl-hp-container {
      position: absolute;
      top: 12px;
      width: 220px;
      height: 18px;
      background: #222;
      border: 2px solid #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
      z-index: 5;
    }

    .bowl-hp-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff9900, #ff5500);
      transition: width 0.2s ease-out;
    }

    .bowl-hp-text {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      font-size: 11px; color: #fff; font-weight: bold;
      text-shadow: 1px 1px 2px #000;
    }

    .bowl-timer-display {
      position: absolute;
      top: 10px;
      background: rgba(0,0,0,0.7);
      border: 2px solid #f1c40f;
      padding: 2px 15px;
      border-radius: 12px;
      color: #f1c40f;
      font-size: 14px;
      font-weight: bold;
      z-index: 6;
      display: none;
    }

    .bowl-fever-container {
      position: absolute;
      bottom: 12px;
      width: 200px;
      height: 14px;
      background: #222;
      border: 2px solid #fff;
      border-radius: 8px;
      overflow: hidden;
      z-index: 5;
    }

    .bowl-fever-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff007f, #00ffff);
      transition: width 0.2s ease-out;
    }

    .damage-text {
      position: absolute;
      font-size: 26px;
      font-weight: 900;
      color: #ffeb3b;
      -webkit-text-stroke: 1.5px #d32f2f;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      z-index: 30;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      50% { transform: translateY(-20px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-40px) scale(1); }
    }

    #cutin-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 100;
    }

    .cutin-title {
      color: #f1c40f;
      font-size: 26px;
      font-weight: bold;
      text-shadow: 0 0 10px #f39c12;
      margin-top: 10px;
      animation: moveIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .cutin-char {
      font-size: 75px;
      animation: zoomIn 0.3s ease-out;
    }

    @keyframes zoomIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    @keyframes moveIn { 0% { transform: translateX(-100%); } 100% { transform: translateX(0); } }

    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.88);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 200;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .modal-title {
      font-size: 26px;
      color: #f1c40f;
      margin-bottom: 12px;
      text-shadow: 2px 2px 4px #000;
    }

    .btn {
      padding: 8px 20px;
      font-size: 15px;
      font-weight: bold;
      background: #2ecc71;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 0 #27ae60;
      margin: 5px;
      transition: transform 0.1s;
    }

    .btn:active { transform: translateY(3px); box-shadow: none; }
    .btn-secondary { background: #e74c3c; box-shadow: 0 4px 0 #c0392b; }
    .btn-gacha { background: #9b59b6; box-shadow: 0 4px 0 #8e44ad; }

    .stage-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-height: 340px;
      overflow-y: auto;
      width: 100%;
      padding: 5px;
    }

    .stage-card {
      background: rgba(255,255,255,0.1);
      border: 2px solid #555;
      border-radius: 10px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .stage-card.locked { opacity: 0.4; pointer-events: none; }
    .stage-card.active { border-color: #f1c40f; background: rgba(241, 196, 15, 0.2); }

    .gacha-results {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-height: 230px;
      overflow-y: auto;
      margin: 10px 0;
      width: 100%;
    }

    .gacha-item {
      background: rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 6px;
      width: 75px;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 10px;
    }

    .gacha-item .icon { font-size: 26px; }

    .team-edit-slots {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin-bottom: 15px;
    }

    .edit-slot-box {
      width: 55px;
      height: 55px;
      border: 2px solid #f1c40f;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(255,255,255,0.1);
      cursor: pointer;
    }

    .edit-slot-box.selected {
      border-color: #00ffff;
      box-shadow: 0 0 10px #00ffff;
    }

    .char-inventory {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-height: 220px;
      overflow-y: auto;
      width: 100%;
      padding: 10px;
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
    }

    .inventory-card {
      width: 60px;
      height: 70px;
      background: rgba(255,255,255,0.15);
      border: 1px solid #777;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 10px;
    }

    .inventory-card .icon { font-size: 24px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

  <div id="game-container">
    <!-- 上部ナビゲーション -->
    <div class="top-nav">
      <button class="nav-btn" onclick="openStageSelect()">ステージ</button>
      <button class="nav-btn" onclick="openTeamEditModal()">編成</button>
      <button class="nav-btn attack-mode-btn" onclick="startScoreAttack()">スコアアタック</button>
      <div class="ypt-badge">
        <span>Ypt:</span>
        <span id="ypt-display">13500</span>
      </div>
      <button class="nav-btn" onclick="openGachaModal()">ガシャ</button>
    </div>

    <!-- ステージエリア -->
    <div id="stage-area">
      <div class="stage-header">
        <span id="stage-title-display">ステージ 1</span>
        <span id="score-text">SCORE: 0</span>
      </div>

      <div class="enemy-box">
        <div class="enemy-name" id="enemy-name-display">ぶようじん坊</div>
        <div class="enemy-sprite" id="enemy-sprite">👿</div>
      </div>
      <div></div>
    </div>

    <!-- チーム・必殺技ゲージエリア -->
    <div id="team-area">
      <div class="char-icon" id="team-icon-0" onclick="useSkill(0)">
        <span id="team-emoji-0">🐱</span>
        <div class="gauge-overlay" id="gauge-0"></div>
      </div>
      <div class="char-icon" id="team-icon-1" onclick="useSkill(1)">
        <span id="team-emoji-1">🐻</span>
        <div class="gauge-overlay" id="gauge-1"></div>
      </div>
      <div class="char-icon" id="team-icon-2" onclick="useSkill(2)">
        <span id="team-emoji-2">🐸</span>
        <div class="gauge-overlay" id="gauge-2"></div>
      </div>
      <div class="char-icon" id="team-icon-3" onclick="useSkill(3)">
        <span id="team-emoji-3">🦊</span>
        <div class="gauge-overlay" id="gauge-3"></div>
      </div>
      <div class="char-icon" id="team-icon-4" onclick="useSkill(4)">
        <span id="team-emoji-4">🐰</span>
        <div class="gauge-overlay" id="gauge-4"></div>
      </div>
    </div>

    <!-- パズルエリア -->
    <div id="puzzle-area">
      <div class="puni-bowl-frame">
        <div class="bowl-hp-container" id="hp-container-elem">
          <div class="bowl-hp-fill" id="hp-bar"></div>
          <div class="bowl-hp-text" id="hp-text">1000 / 1000</div>
        </div>

        <div class="bowl-timer-display" id="attack-timer-display">TIME: 60</div>

        <canvas id="puzzle-canvas"></canvas>

        <div class="bowl-fever-container">
          <div class="bowl-fever-fill" id="fever-bar"></div>
        </div>
      </div>
    </div>

    <!-- 必殺技カットイン -->
    <div id="cutin-overlay">
      <div class="cutin-char" id="cutin-char">🐱</div>
      <div class="cutin-title" id="cutin-title">ひっさつわざ！</div>
    </div>

    <!-- リザルト画面 -->
    <div class="modal-overlay" id="result-modal">
      <h2 class="modal-title" id="result-title">STAGE CLEAR!</h2>
      <p id="result-ypt-text" style="margin-bottom:15px; color:#f1c40f; font-weight:bold;"></p>
      <button class="btn" onclick="nextStageOrRestart()">つぎへ / もう一度</button>
      <button class="btn btn-secondary" onclick="openStageSelect()">ステージ選択へ</button>
    </div>

    <!-- スコアアタック結果リザルト画面 -->
    <div class="modal-overlay" id="score-attack-result-modal">
      <h2 class="modal-title">タイムアップ！</h2>
      <p id="attack-final-score-text" style="font-size:20px; margin-bottom:8px; color:#fff; font-weight:bold;"></p>
      <p id="attack-highscore-text" style="font-size:14px; margin-bottom:20px; color:#f1c40f; font-weight:bold;"></p>
      <button class="btn" onclick="startScoreAttack()">もう一度挑戦</button>
      <button class="btn btn-secondary" onclick="closeScoreAttackResult()">ステージ選択へ</button>
    </div>

    <!-- ステージ選択画面 -->
    <div class="modal-overlay" id="stage-modal">
      <h2 class="modal-title">ステージ選択</h2>
      <div class="stage-grid" id="stage-grid"></div>
      <button class="btn btn-secondary" style="margin-top:10px;" onclick="closeStageSelect()">閉じる</button>
    </div>

    <!-- チーム編成画面 -->
    <div class="modal-overlay" id="team-edit-modal">
      <h2 class="modal-title">チーム編成</h2>
      <p style="font-size:11px; color:#ccc; margin-bottom:8px;">入れ替えたい枠を選び、下からキャラを選択</p>
      <div class="team-edit-slots" id="team-edit-slots"></div>
      <div class="char-inventory" id="char-inventory"></div>
      <button class="btn btn-secondary" style="margin-top:10px;" onclick="closeTeamEditModal()">完了</button>
    </div>

    <!-- ガシャ画面 -->
    <div class="modal-overlay" id="gacha-modal">
      <h2 class="modal-title">妖怪ガシャ</h2>
      <p style="font-size:11px; color:#ccc; margin-bottom:8px;">単発: 500 Ypt / 10連: 4500 Ypt (10連はレア1体以上確定！)</p>
      <div id="gacha-action-area">
        <button class="btn btn-gacha" onclick="drawGacha(1)">1連ガシャ (500pt)</button>
        <button class="btn btn-gacha" onclick="drawGacha(10)">10連ガシャ (4500pt・確定枠あり)</button>
      </div>
      <div class="gacha-results" id="gacha-results"></div>
      <button class="btn btn-secondary" onclick="closeGachaModal()">閉じる</button>
    </div>
  </div>

  <script>
    const { Engine, Bodies, Composite, Runner } = Matter;

    const CHARACTER_DB = {
      tadokoro: { id: 'tadokoro', name: '田所浩二', emoji: '🍺', color: '#d35400', rate: 0.01, skillType: 'MASS_CLEAR', skillName: '野獣ラッシュ', startGauge: 0, extraYpt: 0 },
      kinji:     { id: 'kinji',    name: '金爺',     emoji: '👴', color: '#f39c12', rate: 0.01, skillType: 'BUFF',       skillName: 'ゴールドバフ', startGauge: 0,    extraYpt: 4 },
      harinezumi:{ id: 'harinezumi',name: 'ハリネズミ',emoji: '🦔', color: '#e67e22', rate: 0.01, skillType: 'MAKE_BIG',   skillName: 'デカぷに召喚', startGauge: 0,    extraYpt: 0 },
      takapi:    { id: 'takapi',   name: 'たｋぴー', emoji: '😎', color: '#9b59b6', rate: 0.01, skillType: 'ALL_CLEAR',  skillName: 'アルティメット全消し', startGauge: 0, extraYpt: 0 },
      takashikun:{ id: 'takashikun',name: 'たかし',   emoji: '👦', color: '#2ecc71', rate: 0.01, skillType: 'MASS_CLEAR', skillName: 'たかしパンチ', startGauge: 0,    extraYpt: 0 },
      yowayowa:  { id: 'yowayowa',  name: 'よわよわ', emoji: '💧', color: '#7f8c8d', rate: 0.95,  skillType: 'NONE',       skillName: 'なし',         startGauge: 0,    extraYpt: 0 },
      
      cat:   { id: 'cat',   name: 'ジバぷに', emoji: '🐱', color: '#e74c3c', rate: 0, skillType: 'CENTER_CLEAR', skillName: 'ひのたまパンチ', startGauge: 0, extraYpt: 0 },
      bear:  { id: 'bear',  name: 'クマーぷに', emoji: '🐻', color: '#3498db', rate: 0, skillType: 'BOTTOM_CLEAR', skillName: 'クマーチョップ', startGauge: 0, extraYpt: 0 },
      frog:  { id: 'frog',  name: 'ケロぷに', emoji: '🐸', color: '#2ecc71', rate: 0, skillType: 'TOP_CLEAR',    skillName: 'ケロジャンプ', startGauge: 0, extraYpt: 0 },
      fox:   { id: 'fox',   name: 'コンぷに', emoji: '🦊', color: '#f1c40f', rate: 0, skillType: 'CENTER_CLEAR', skillName: 'きつねび', startGauge: 0, extraYpt: 0 },
      bunny: { id: 'bunny', name: 'ウサぷに', emoji: '🐰', color: '#9b59b6', rate: 0, skillType: 'BOTTOM_CLEAR', skillName: 'うさキック', startGauge: 0, extraYpt: 0 }
    };

    const STAGES = [
      { id: 1, name: 'ぶようじん坊', emoji: '👿', hp: 1000 },
      { id: 2, name: 'グレるりん', emoji: '👹', hp: 1800 },
      { id: 3, name: 'じんめん犬', emoji: '🐶', hp: 2800 },
      { id: 4, name: 'コマさん', emoji: '🦁', hp: 4000 },
      { id: 5, name: 'メラメライオン', emoji: '🦁', hp: 5500 },
      { id: 6, name: 'ふぶき姫', emoji: '❄️', hp: 7500 },
      { id: 7, name: 'オロチ', emoji: '🐍', hp: 10000 },
      { id: 8, name: 'キュウビ', emoji: '🦊', hp: 13500 },
      { id: 9, name: 'ミツマタノヅチ', emoji: '👁️', hp: 18000 },
      { id: 10, name: 'つられたろう丸', emoji: '🎣', hp: 24000 },
      { id: 11, name: 'のぼせトンマン', emoji: '♨️', hp: 32000 },
      { id: 12, name: 'イカカモネ議長', emoji: '🦑', hp: 45000 }
    ];

    let currentStageIndex = 0;
    let unlockedStage = 1;
    let ypt = 13500;
    let scoreAttackHighScore = 0;

    let ownedCharIds = ['cat', 'bear', 'frog', 'fox', 'bunny', 'yowayowa'];
    let myTeam = [
      CHARACTER_DB.cat,
      CHARACTER_DB.bear,
      CHARACTER_DB.frog,
      CHARACTER_DB.fox,
      CHARACTER_DB.bunny
    ];

    const BASE_RADIUS = 17;
    const MAX_SIZE = 8;
    const GAUGE_MAX = 100;

    let engine, runner, canvas, ctx;
    let puniBodies = [];
    let isConnecting = false;
    let connectedPunis = [];
    let currentMousePos = { x: 0, y: 0 };

    let score = 0;
    let enemyMaxHp = 1000;
    let enemyHp = 1000;
    let gauges = [0, 0, 0, 0, 0];

    let feverGauge = 0;
    const FEVER_MAX = 100;
    let isFever = false;
    let feverTimer = null;
    let accumulatedFeverDamage = 0;

    let gameMode = 'stage';
    let attackTimeLeft = 60;
    let attackTimerInterval = null;
    let isSkillExecuting = false;

    let attackBuffBonus = 0.0;
    let gaugeBuffBonus = 0.0;
    let selectedSlotIndex = 0;

    window.addEventListener('load', () => {
      loadSavedData();
      initPhysics();
      setupTeamUI();
      loadStage(currentStageIndex);
      setupInputEvents();
      gameLoop();
    });

    function loadSavedData() {
      const isGranted13500 = localStorage.getItem('puni_granted_13500_v10');
      if (!isGranted13500) {
        ypt = 13500;
        localStorage.setItem('puni_granted_13500_v10', 'true');
        saveGameData();
      } else {
        const savedYpt = localStorage.getItem('puni_ypt');
        ypt = savedYpt !== null ? parseInt(savedYpt, 10) : 13500;
      }

      const savedStage = localStorage.getItem('puni_unlockedStage');
      if (savedStage !== null) unlockedStage = parseInt(savedStage, 10);

      const savedHighScore = localStorage.getItem('puni_score_attack_highscore');
      if (savedHighScore !== null) scoreAttackHighScore = parseInt(savedHighScore, 10);

      const savedOwned = localStorage.getItem('puni_ownedChars');
      if (savedOwned !== null) ownedCharIds = JSON.parse(savedOwned);

      const savedTeam = localStorage.getItem('puni_myTeam');
      if (savedTeam !== null) {
        const teamIds = JSON.parse(savedTeam);
        myTeam = teamIds.map(id => CHARACTER_DB[id] || CHARACTER_DB.yowayowa);
      }

      updateYptDisplay();
    }

    function saveGameData() {
      localStorage.setItem('puni_ypt', ypt);
      localStorage.setItem('puni_unlockedStage', unlockedStage);
      localStorage.setItem('puni_score_attack_highscore', scoreAttackHighScore);
      localStorage.setItem('puni_ownedChars', JSON.stringify(ownedCharIds));
      const teamIds = myTeam.map(c => c.id);
      localStorage.setItem('puni_myTeam', JSON.stringify(teamIds));
    }

    function updateYptDisplay() {
      document.getElementById('ypt-display').innerText = ypt;
    }

    function setupTeamUI() {
      for (let i = 0; i < 5; i++) {
        const char = myTeam[i];
        const emojiEl = document.getElementById(`team-emoji-${i}`);
        emojiEl.innerText = char.emoji;
      }
    }

    function initPhysics() {
      const frame = document.querySelector('.puni-bowl-frame');
      const width = frame.clientWidth;
      const height = frame.clientHeight;

      canvas = document.getElementById('puzzle-canvas');
      canvas.width = width;
      canvas.height = height;
      ctx = canvas.getContext('2d');

      engine = Engine.create({ gravity: { x: 0, y: 1.2 } });

      const centerX = width / 2;
      const centerY = height / 2;
      const bowlRadius = width * 0.48;
      const segments = 40;

      for (let i = 0; i < segments; i++) {
        const angle1 = Math.PI * 0.05 + (Math.PI * 0.90) * (i / segments);
        const angle2 = Math.PI * 0.05 + (Math.PI * 0.90) * ((i + 1) / segments);

        const x1 = centerX + bowlRadius * Math.cos(angle1);
        const y1 = centerY + bowlRadius * Math.sin(angle1);
        const x2 = centerX + bowlRadius * Math.cos(angle2);
        const y2 = centerY + bowlRadius * Math.sin(angle2);

        const wallX = (x1 + x2) / 2;
        const wallY = (y1 + y2) / 2;
        const length = Math.hypot(x2 - x1, y2 - y1) + 6;
        const wallAngle = Math.atan2(y2 - y1, x2 - x1);

        const wall = Bodies.rectangle(wallX, wallY, length, 40, {
          isStatic: true,
          angle: wallAngle,
          friction: 0.02,
          restitution: 0.15
        });
        Composite.add(engine.world, wall);
      }

      runner = Runner.create();
      Runner.run(runner, engine);
    }

    function loadStage(index) {
      gameMode = 'stage';
      if (attackTimerInterval) clearInterval(attackTimerInterval);
      if (feverTimer) clearInterval(feverTimer);

      document.getElementById('hp-container-elem').style.display = 'block';
      document.getElementById('attack-timer-display').style.display = 'none';

      currentStageIndex = index;
      const stage = STAGES[index];

      enemyMaxHp = stage.hp;
      enemyHp = stage.hp;
      score = 0;
      feverGauge = 0;
      isFever = false;
      isSkillExecuting = false;
      accumulatedFeverDamage = 0;
      attackBuffBonus = 0.0;
      gaugeBuffBonus = 0.0;

      document.getElementById('stage-title-display').innerText = `ステージ ${stage.id}`;
      document.getElementById('enemy-name-display').innerText = stage.name;
      document.getElementById('enemy-sprite').innerText = stage.emoji;
      document.getElementById('score-text').innerText = `SCORE: 0`;

      document.getElementById('hp-bar').style.width = '100%';
      document.getElementById('hp-text').innerText = `${enemyHp} / ${enemyMaxHp}`;
      updateFeverBar();

      for (let i = 0; i < 5; i++) {
        gauges[i] = 0;
        updateGaugeUI(i);
      }

      [...puniBodies].forEach(p => removePuni(p));
      spawnInitialPunis(45);
    }

    function startScoreAttack() {
      document.getElementById('score-attack-result-modal').style.display = 'none';
      document.getElementById('result-modal').style.display = 'none';
      document.getElementById('stage-modal').style.display = 'none';
      document.getElementById('team-edit-modal').style.display = 'none';
      document.getElementById('gacha-modal').style.display = 'none';

      if (feverTimer) clearInterval(feverTimer);

      gameMode = 'score_attack';
      score = 0;
      attackTimeLeft = 60;
      feverGauge = 0;
      isFever = false;
      isSkillExecuting = false;
      accumulatedFeverDamage = 0;
      attackBuffBonus = 0.0;
      gaugeBuffBonus = 0.0;

      document.getElementById('hp-container-elem').style.display = 'none';
      const timerDisplay = document.getElementById('attack-timer-display');
      timerDisplay.style.display = 'block';
      timerDisplay.innerText = `TIME: ${attackTimeLeft}`;

      document.getElementById('stage-title-display').innerText = `スコアアタック`;
      document.getElementById('enemy-name-display').innerText = `制限時間アタック`;
      document.getElementById('enemy-sprite').innerText = `⏱️`;
      document.getElementById('score-text').innerText = `SCORE: 0`;
      updateFeverBar();

      for (let i = 0; i < 5; i++) {
        gauges[i] = 0;
        updateGaugeUI(i);
      }

      [...puniBodies].forEach(p => removePuni(p));
      spawnInitialPunis(45);

      if (attackTimerInterval) clearInterval(attackTimerInterval);
      attackTimerInterval = setInterval(() => {
        if (isSkillExecuting || isFever) return;

        attackTimeLeft--;
        timerDisplay.innerText = `TIME: ${attackTimeLeft}`;

        if (attackTimeLeft <= 0) {
          clearInterval(attackTimerInterval);
          endScoreAttack();
        }
      }, 1000);
    }

    function endScoreAttack() {
      if (score > scoreAttackHighScore) {
        scoreAttackHighScore = score;
        saveGameData();
      }

      document.getElementById('attack-final-score-text').innerText = `獲得スコア: ${score}点`;
      document.getElementById('attack-highscore-text').innerText = `ハイスコア: ${scoreAttackHighScore}点`;
      document.getElementById('score-attack-result-modal').style.display = 'flex';
    }

    function closeScoreAttackResult() {
      document.getElementById('score-attack-result-modal').style.display = 'none';
      loadStage(0);
    }

    function createPuni(x, y, teamSlotIndex, size = 1) {
      const radius = BASE_RADIUS * Math.pow(1.22, size - 1);
      const body = Bodies.circle(x, y, radius, {
        restitution: 0.25,
        friction: 0.05,
        density: 0.001 * size,
        label: 'puni'
      });

      body.puniData = {
        slot: teamSlotIndex,
        size: size,
        radius: radius
      };

      Composite.add(engine.world, body);
      puniBodies.push(body);
      return body;
    }

    function spawnInitialPunis(count) {
      const width = canvas.width;
      for (let i = 0; i < count; i++) {
        const x = width / 2 + (Math.random() - 0.5) * 160;
        const y = 40 + Math.random() * 80;
        const slot = Math.floor(Math.random() * 5);
        createPuni(x, y, slot, 1);
      }
    }

    function replenishPunis() {
      const targetCount = 45;
      const currentCount = puniBodies.length;
      if (currentCount < targetCount) {
        const need = targetCount - currentCount;
        for (let i = 0; i < need; i++) {
          setTimeout(() => {
            if (puniBodies.length < targetCount && (gameMode === 'score_attack' || enemyHp > 0)) {
              const x = canvas.width / 2 + (Math.random() - 0.5) * 140;
              const slot = Math.floor(Math.random() * 5);
              createPuni(x, 20, slot, 1);
            }
          }, i * 40);
        }
      }
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (isConnecting && connectedPunis.length > 0) {
        const slot = connectedPunis[0].puniData.slot;
        ctx.beginPath();
        ctx.strokeStyle = myTeam[slot].color;
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        for (let i = 0; i < connectedPunis.length; i++) {
          const pos = connectedPunis[i].position;
          if (i === 0) ctx.moveTo(pos.x, pos.y);
          else ctx.lineTo(pos.x, pos.y);
        }
        ctx.lineTo(currentMousePos.x, currentMousePos.y);
        ctx.stroke();
      }

      for (let body of puniBodies) {
        const { x, y } = body.position;
        const data = body.puniData;
        const char = myTeam[data.slot];

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(body.angle);

        const isSelected = connectedPunis.includes(body);

        ctx.beginPath();
        ctx.arc(0, 0, data.radius, 0, Math.PI * 2);
        ctx.fillStyle = char.color;
        ctx.fill();
        ctx.lineWidth = isSelected ? 4 : 2;
        ctx.strokeStyle = isSelected ? '#ffffff' : 'rgba(0,0,0,0.3)';
        ctx.stroke();

        ctx.rotate(-body.angle);
        ctx.font = `${data.radius * 1.1}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(char.emoji, 0, 2);

        ctx.restore();
      }

      requestAnimationFrame(gameLoop);
    }

    function setupInputEvents() {
      const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      };

      const startConnect = (e) => {
        if (gameMode === 'stage' && enemyHp <= 0) return;
        if (gameMode === 'score_attack' && attackTimeLeft <= 0) return;

        isConnecting = true;
        connectedPunis = [];
        const pos = getPos(e);
        currentMousePos = pos;
        checkConnect(pos);
      };

      const moveConnect = (e) => {
        if (!isConnecting) return;
        const pos = getPos(e);
        currentMousePos = pos;
        checkConnect(pos);
      };

      const endConnect = () => {
        if (!isConnecting) return;
        isConnecting = false;

        if (connectedPunis.length >= 2) {
          mergePunis(connectedPunis);
        } else if (connectedPunis.length === 1) {
          popPuni(connectedPunis[0]);
        }
        connectedPunis = [];
      };

      canvas.addEventListener('mousedown', startConnect);
      canvas.addEventListener('mousemove', moveConnect);
      window.addEventListener('mouseup', endConnect);

      canvas.addEventListener('touchstart', startConnect, { passive: true });
      canvas.addEventListener('touchmove', moveConnect, { passive: true });
      window.addEventListener('touchend', endConnect);
    }

    function checkConnect(pos) {
      for (let body of puniBodies) {
        const dist = Math.hypot(body.position.x - pos.x, body.position.y - pos.y);
        if (dist < body.puniData.radius * 1.2) {
          if (connectedPunis.length === 0) {
            connectedPunis.push(body);
          } else {
            const last = connectedPunis[connectedPunis.length - 1];
            const first = connectedPunis[0];

            if (
              body.puniData.slot === first.puniData.slot &&
              !connectedPunis.includes(body)
            ) {
              const linkDist = Math.hypot(body.position.x - last.position.x, body.position.y - last.position.y);
              if (linkDist < (body.puniData.radius + last.puniData.radius) * 2.2) {
                connectedPunis.push(body);
              }
            }
          }
          break;
        }
      }
    }

    function mergePunis(list) {
      const target = list[list.length - 1];
      const slot = target.puniData.slot;
      
      let totalSize = 0;
      list.forEach(p => totalSize += p.puniData.size);
      const newSize = Math.min(MAX_SIZE, totalSize);

      const x = target.position.x;
      const y = target.position.y;

      list.forEach(p => removePuni(p));
      createPuni(x, y, slot, newSize);

      const gaugeGain = list.length * 4 * (1.0 + gaugeBuffBonus);
      addGauge(slot, gaugeGain);

      score += list.length * 15;
      document.getElementById('score-text').innerText = `SCORE: ${score}`;

      addFever(list.length * 2);
      replenishPunis();
    }

    function popPuni(puni) {
      const data = puni.puniData;
      let baseDamage = Math.floor(Math.pow(data.size, 1.8) * 15);
      if (isFever) baseDamage = Math.floor(baseDamage * 1.5);
      
      const totalAttackMultiplier = 1.0 + attackBuffBonus;
      baseDamage = Math.floor(baseDamage * totalAttackMultiplier);

      applyDamage(baseDamage, puni.position.x, puni.position.y);
      score += baseDamage * 10;
      document.getElementById('score-text').innerText = `SCORE: ${score}`;

      const gaugeGain = data.size * 5 * (1.0 + gaugeBuffBonus);
      addGauge(data.slot, gaugeGain);

      addFever(data.size * 3);
      removePuni(puni);
      replenishPunis();
    }

    function removePuni(puni) {
      Composite.remove(engine.world, puni);
      puniBodies = puniBodies.filter(b => b !== puni);
    }

    function applyDamage(amount, x, y) {
      if (gameMode === 'score_attack') {
        showDamageText(amount, x, y);
        return;
      }

      if (isFever) {
        accumulatedFeverDamage += amount;
        showDamageText(`FEVER! +${amount}`, x, y);
      } else {
        enemyHp = Math.max(0, enemyHp - amount);
        const hpPercent = (enemyHp / enemyMaxHp) * 100;
        document.getElementById('hp-bar').style.width = `${hpPercent}%`;
        document.getElementById('hp-text').innerText = `${enemyHp} / ${enemyMaxHp}`;

        showDamageText(amount, x, y);

        if (enemyHp <= 0) {
          onStageClear();
        }
      }
    }

    function showDamageText(amount, x, y) {
      const container = document.getElementById('stage-area');
      const el = document.createElement('div');
      el.className = 'damage-text';
      el.innerText = amount;
      el.style.left = `${40 + Math.random() * 120}px`;
      el.style.top = `${40 + Math.random() * 40}px`;

      container.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    function addFever(amount) {
      if (isFever) return;
      feverGauge = Math.min(FEVER_MAX, feverGauge + amount);
      updateFeverBar();

      if (feverGauge >= FEVER_MAX) {
        startFever();
      }
    }

    function updateFeverBar() {
      const percent = (feverGauge / FEVER_MAX) * 100;
      document.getElementById('fever-bar').style.width = `${percent}%`;
    }

    function startFever() {
      isFever = true;
      accumulatedFeverDamage = 0;

      let feverLeft = 10;
      if (feverTimer) clearInterval(feverTimer);

      feverTimer = setInterval(() => {
        if (isSkillExecuting) return;

        feverLeft -= 1;
        feverGauge = (feverLeft / 10) * FEVER_MAX;
        updateFeverBar();

        if (feverLeft <= 0) {
          clearInterval(feverTimer);
          isFever = false;
          feverGauge = 0;
          updateFeverBar();

          if (gameMode === 'stage' && accumulatedFeverDamage > 0) {
            const finalFeverDmg = Math.floor(accumulatedFeverDamage * 1.2);
            showDamageText(`FEVER FINISH! [${finalFeverDmg}]`, canvas.width / 2 - 50, 50);
            applyDamageDirect(finalFeverDmg);
          }
        }
      }, 1000);
    }

    function applyDamageDirect(amount) {
      enemyHp = Math.max(0, enemyHp - amount);
      const hpPercent = (enemyHp / enemyMaxHp) * 100;
      document.getElementById('hp-bar').style.width = `${hpPercent}%`;
      document.getElementById('hp-text').innerText = `${enemyHp} / ${enemyMaxHp}`;

      if (enemyHp <= 0) {
        onStageClear();
      }
    }

    function addGauge(slot, amount) {
      gauges[slot] = Math.min(GAUGE_MAX, gauges[slot] + amount);
      updateGaugeUI(slot);
    }

    function updateGaugeUI(slot) {
      const overlay = document.getElementById(`gauge-${slot}`);
      const icon = document.getElementById(`team-icon-${slot}`);
      const percent = (gauges[slot] / GAUGE_MAX) * 100;
      overlay.style.height = `${percent}%`;

      if (gauges[slot] >= GAUGE_MAX) {
        icon.classList.add('ready');
      } else {
        icon.classList.remove('ready');
      }
    }

    function useSkill(slot) {
      if (gauges[slot] < GAUGE_MAX) return;
      if (gameMode === 'stage' && enemyHp <= 0) return;
      if (gameMode === 'score_attack' && attackTimeLeft <= 0) return;

      const char = myTeam[slot];
      if (char.skillType === 'NONE') return;

      gauges[slot] = 0;
      updateGaugeUI(slot);

      isSkillExecuting = true;

      const cutin = document.getElementById('cutin-overlay');
      document.getElementById('cutin-char').innerText = char.emoji;
      document.getElementById('cutin-title').innerText = char.skillName;
      cutin.style.display = 'flex';

      setTimeout(() => {
        cutin.style.display = 'none';
        executeSkillEffect(char);
      }, 900);
    }

    function executeSkillEffect(char) {
      const centerY = canvas.height / 2;
      const totalAttackMultiplier = 1.0 + attackBuffBonus;

      switch (char.skillType) {
        case 'ALL_CLEAR': {
          let targetPunis = [...puniBodies];
          executeSequentialClear(targetPunis, 60, totalAttackMultiplier);
          break;
        }

        case 'MASS_CLEAR': {
          let countBefore = puniBodies.length;
          let targetPunis = puniBodies.slice(0, Math.floor(countBefore * 0.75));
          executeSequentialClear(targetPunis, 50, totalAttackMultiplier);
          break;
        }

        case 'CENTER_CLEAR': {
          let targetPunis = puniBodies.filter(p => Math.abs(p.position.y - centerY) < 90);
          executeSequentialClear(targetPunis, 40, totalAttackMultiplier);
          break;
        }

        case 'BOTTOM_CLEAR': {
          let targetPunis = puniBodies.filter(p => p.position.y > centerY);
          executeSequentialClear(targetPunis, 40, totalAttackMultiplier);
          break;
        }

        case 'TOP_CLEAR': {
          let targetPunis = puniBodies.filter(p => p.position.y <= centerY);
          executeSequentialClear(targetPunis, 40, totalAttackMultiplier);
          break;
        }

        case 'MAKE_BIG': {
          for (let i = 0; i < 4; i++) {
            if (puniBodies.length > 0) removePuni(puniBodies[0]);
            const x = canvas.width * (0.2 + Math.random() * 0.6);
            const slot = Math.floor(Math.random() * 5);
            createPuni(x, 100, slot, 6);
          }
          replenishPunis();
          isSkillExecuting = false;
          break;
        }

        case 'BUFF': {
          attackBuffBonus += 0.5;
          gaugeBuffBonus += 0.5;
          showDamageText(`BUFF +50%!`, canvas.width / 2, 100);
          isSkillExecuting = false;
          break;
        }
      }
    }

    function executeSequentialClear(targetList, damagePerPuni, multiplier) {
      if (targetList.length === 0) {
        isSkillExecuting = false;
        return;
      }
      let index = 0;

      const interval = setInterval(() => {
        if (index < targetList.length && (gameMode === 'score_attack' || enemyHp <= 0 === false)) {
          const puni = targetList[index];
          const px = puni.position.x;
          const py = puni.position.y;
          const slot = puni.puniData.slot;
          
          removePuni(puni);
          
          let dmg = Math.floor(damagePerPuni * multiplier);
          applyDamage(dmg, px, py);
          score += dmg * 5;
          document.getElementById('score-text').innerText = `SCORE: ${score}`;

          // ★追加: 技で消したときもチームキャラ全員（または消したぷにの枠）のゲージをためる！ (金爺ボーナスも反映)
          const gaugeGain = 2 * (1.0 + gaugeBuffBonus);
          addGauge(slot, gaugeGain);

          index++;
        } else {
          clearInterval(interval);
          replenishPunis();
          isSkillExecuting = false;
        }
      }, 25);
    }

    function onStageClear() {
      if (gameMode !== 'stage') return;

      let extraPt = 0;
      myTeam.forEach(char => {
        if (char.extraYpt) extraPt += char.extraYpt;
      });
      const rewardYpt = 7 + extraPt;
      ypt += rewardYpt;
      updateYptDisplay();

      if (currentStageIndex + 1 < STAGES.length) {
        unlockedStage = Math.max(unlockedStage, currentStageIndex + 2);
      }
      saveGameData();

      setTimeout(() => {
        document.getElementById('result-title').innerText = 'STAGE CLEAR!';
        document.getElementById('result-ypt-text').innerText = `+${rewardYpt} Ypt 獲得！ (基本7pt + スキル${extraPt}pt)`;
        document.getElementById('result-modal').style.display = 'flex';
      }, 500);
    }

    function nextStageOrRestart() {
      document.getElementById('result-modal').style.display = 'none';
      if (currentStageIndex + 1 < STAGES.length) {
        loadStage(currentStageIndex + 1);
      } else {
        loadStage(currentStageIndex);
      }
    }

    function openStageSelect() {
      document.getElementById('result-modal').style.display = 'none';
      document.getElementById('team-edit-modal').style.display = 'none';
      document.getElementById('gacha-modal').style.display = 'none';

      const grid = document.getElementById('stage-grid');
      grid.innerHTML = '';

      STAGES.forEach((stg, i) => {
        const card = document.createElement('div');
        const isLocked = (i + 1) > unlockedStage;
        card.className = `stage-card ${isLocked ? 'locked' : ''} ${gameMode === 'stage' && i === currentStageIndex ? 'active' : ''}`;
        card.innerHTML = `
          <div style="font-size:20px;">${stg.emoji}</div>
          <div style="font-weight:bold; font-size:11px;">Stage ${stg.id}</div>
          <div style="font-size:9px; color:#aaa;">${stg.name}</div>
        `;
        if (!isLocked) {
          card.onclick = () => {
            closeStageSelect();
            loadStage(i);
          };
        }
        grid.appendChild(card);
      });

      document.getElementById('stage-modal').style.display = 'flex';
    }

    function closeStageSelect() {
      document.getElementById('stage-modal').style.display = 'none';
    }

    function openTeamEditModal() {
      document.getElementById('result-modal').style.display = 'none';
      document.getElementById('stage-modal').style.display = 'none';
      document.getElementById('gacha-modal').style.display = 'none';

      renderTeamEditUI();
      document.getElementById('team-edit-modal').style.display = 'flex';
    }

    function closeTeamEditModal() {
      document.getElementById('team-edit-modal').style.display = 'none';
      setupTeamUI();
      saveGameData();
      if (gameMode === 'stage') loadStage(currentStageIndex);
    }

    function renderTeamEditUI() {
      const slotsContainer = document.getElementById('team-edit-slots');
      slotsContainer.innerHTML = '';

      for (let i = 0; i < 5; i++) {
        const char = myTeam[i];
        const box = document.createElement('div');
        box.className = `edit-slot-box ${i === selectedSlotIndex ? 'selected' : ''}`;
        box.innerHTML = `<span style="font-size:22px;">${char.emoji}</span><span style="font-size:8px;">枠${i+1}</span>`;
        box.onclick = () => {
          selectedSlotIndex = i;
          renderTeamEditUI();
        };
        slotsContainer.appendChild(box);
      }

      const invContainer = document.getElementById('char-inventory');
      invContainer.innerHTML = '';

      ownedCharIds.forEach(id => {
        const char = CHARACTER_DB[id];
        if (!char) return;

        const card = document.createElement('div');
        card.className = 'inventory-card';
        card.innerHTML = `
          <div class="icon">${char.emoji}</div>
          <div style="font-weight:bold;">${char.name}</div>
        `;
        card.onclick = () => {
          myTeam[selectedSlotIndex] = char;
          renderTeamEditUI();
        };
        invContainer.appendChild(card);
      });
    }

    function openGachaModal() {
      document.getElementById('result-modal').style.display = 'none';
      document.getElementById('stage-modal').style.display = 'none';
      document.getElementById('team-edit-modal').style.display = 'none';

      document.getElementById('gacha-results').innerHTML = '';
      document.getElementById('gacha-modal').style.display = 'flex';
    }

    function closeGachaModal() {
      document.getElementById('gacha-modal').style.display = 'none';
    }

    function drawGacha(count) {
      const cost = count === 1 ? 500 : 4500;
      if (ypt < cost) {
        alert('Yptが足りません！ステージをクリアして集めてね。');
        return;
      }

      ypt -= cost;
      updateYptDisplay();

      const results = [];
      const rareKeys = ['tadokoro', 'kinji', 'harinezumi', 'takapi', 'takashikun'];

      for (let i = 0; i < count; i++) {
        let selected = CHARACTER_DB.yowayowa;

        if (count === 10 && i === 9) {
          const randomRareKey = rareKeys[Math.floor(Math.random() * rareKeys.length)];
          selected = CHARACTER_DB[randomRareKey];
        } else {
          const rand = Math.random();
          let cumulative = 0;
          const allKeys = [...rareKeys, 'yowayowa'];

          for (let k of allKeys) {
            cumulative += CHARACTER_DB[k].rate;
            if (rand <= cumulative) {
              selected = CHARACTER_DB[k];
              break;
            }
          }
        }

        results.push(selected);
        if (!ownedCharIds.includes(selected.id)) {
          ownedCharIds.push(selected.id);
        }
      }

      saveGameData();

      const resContainer = document.getElementById('gacha-results');
      resContainer.innerHTML = '';
      results.forEach(res => {
        const item = document.createElement('div');
        item.className = 'gacha-item';
        item.innerHTML = `
          <div class="icon">${res.emoji}</div>
          <div style="font-weight:bold; color:${res.rate > 0 ? '#f1c40f' : '#fff'}">${res.name}</div>
          <div style="font-size:8px; color:#aaa;">${res.rate > 0 ? 'レア！' : 'ノーマル'}</div>
        `;
        resContainer.appendChild(item);
      });
    }
  </script>
</body>
</html>
